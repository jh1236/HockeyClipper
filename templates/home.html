<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/html">
<body>

<h1>Live Hockey Clipper</h1>
<form action="/clip" method="post" onsubmit="alert('This will take a few seconds!')">
    <label for="link">Game Link:</label><br>
    <input type="text" id="link" name="link"><br>
    <label for="timecode">Timestamp:</label><br>
    <input type="text" id="timecode" name="timecode"><br/>
    <label for="length">Length (seconds):</label><br>
    <input type="number" id="length" name="length">
    <br/>
    <br/>
    <input type="submit" value="Submit">
</form>

</body>
</html>
